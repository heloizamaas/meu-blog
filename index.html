<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <style>
        header{
            background-color:#BED7F1;
            color: #0B1C2F;
            text-align: center;
            max-width: 500xp;
            margin:auto;
        }
        main{
            background-color:#BED7F1;
            color: #0B1C2F;
            text-align: center;
            max-width: 500xp;
            margin:auto;

        }
    </style>
</head>
<body>
    <header>
    <h1>Olá, bem vindo ao meu blog </h1>
    <p>Meu nome é Heloíza</p>
    </header>
    <main>
        <img src="" alt="">
        <h2>Vou falar sobre a larissa</h2>
        <p>Ela é legal</p>
        <button>❤️<span>0</span></button>
        <button>👎<span>0</span></button>
    </main>
</body>
<script>
    const botoes = document.querySelectorAll("button");
    botoes.forEach(function(botao) {
        let curtiu = false;
    botao.addEventListener("click", botaoClicado);

function botaoClicado() {
console.log("fui clicado");
let texto = botao.querySelector("span");

if (curtiu === false) {
texto.textContent++;
curtiu = true;
} else {
texto.textContent--;
curtiu = false;
}
}
});
</script>
</html>
